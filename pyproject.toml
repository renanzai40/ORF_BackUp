[project]
name = "omni-re-formatter"
version = "0.3.0"
description = "Omni-Re-Formatter: 将本地化后的 MD/XLIFF 还原为目标复杂格式"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "1StepMore" }
]
keywords = ["localization", "docx", "md", "xliff", "pandoc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "python-magic>=0.4.27",
    "beautifulsoup4>=4.12.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "fastmcp>=0.1.0",
    "weasyprint>=60.0",
    "boto3>=1.34.0",
    "azure-storage-blob>=12.19.0",
    "openai>=1.12.0",
    "openpyxl>=3.0.0",
    "moto>=5.0.0",
    "build>=1.0.0",   # for test_packaging (python -m build)
    "pip>=24.0.0",    # for test_packaging (subprocess python -m pip install -e .)
]
test = ["coverage"]
weasyprint = ["weasyprint>=60.0"]
cloud = ["boto3>=1.34.0", "azure-storage-blob>=12.19.0"]
ai = ["openai>=1.12.0"]
office = ["openpyxl>=3.0.0"]
notebook = ["nbformat>=5.0.0"]
email-output = ["aspose-email-foss>=24.0.0"]
mcp = ["fastmcp>=0.1.0"]

[project.scripts]
orf = "orf.cli:main"
orf-mcp-server = "orf.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true