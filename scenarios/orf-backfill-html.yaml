name: orf-backfill-html
description: >-
  ORF apply-md backfill to HTML: run the real `orf apply-md` CLI on the
  committed translated-MD fixture and verify the output file is produced
  (exit 0 + 'Created <path>' on stdout) and carries the HTML structural
  signature: an <html> element, a <body> element, and the translated
  markdown content preserved in the body (frontmatter stripped, not
  rendered).
category: orf-backfill
tier: 1
requires_env: [MCP_ALLOWED_DIRECTORIES]
instructions: |-
  Prove ORF apply-md backfills a translated MD to HTML with the real surface
  ('orf apply-md ... --target-format html'). 1) the provision step copies the
  committed fixture Omni_Re_Formatter/scenarios/_fixtures/translated_md.md
  into /tmp/omni_val/orf-backfill-html/in.md (ORF does not create output
  parent dirs, so the dir is created up front); 2) the CLI step runs the real
  backfill to /tmp/omni_val/orf-backfill-html/out.html and must exit 0
  announcing the created file; 3) the assert step reads the output and checks
  the HTML signature: contains <html> and <body>, and the markdown heading
  'Synthetic Document' survived (md2html strips YAML frontmatter — ORF
  CHANGELOG v0.4.16 'md2html.py: convert() now strips YAML frontmatter').
  Hermetic and deterministic (tier 1): markdown lib (pure Python), no LLM, no
  pandoc. Requires MCP_ALLOWED_DIRECTORIES (ORF is fail-closed on the MCP
  allowlist, orf/mcp/config.py:179-186) — the standard tier-1 run setup, not
  an API key.
steps:
  - name: Provision fixture into the scenario dir
    kind: python
    command: |-
      import pathlib, shutil
      src = pathlib.Path("Omni_Re_Formatter/scenarios/_fixtures/translated_md.md")
      d = pathlib.Path("/tmp/omni_val/orf-backfill-html")
      d.mkdir(parents=True, exist_ok=True)
      shutil.copy(src, d / "in.md")
      print("PROVISIONED /tmp/omni_val/orf-backfill-html/in.md")
    expect:
      exit_code: 0
      stdout_has: ["PROVISIONED /tmp/omni_val/orf-backfill-html/in.md"]
    standard: STANDARDS.md#exit-codes
    instructions: |-
      Copy the committed fixture Omni_Re_Formatter/scenarios/_fixtures/translated_md.md to /tmp/omni_val/orf-backfill-html/in.md, creating the output dir (ORF's channels do not create parent dirs). The snippet exits 0 and prints the PROVISIONED marker.
  - name: Backfill MD to HTML with orf apply-md
    kind: cli
    command: orf apply-md /tmp/omni_val/orf-backfill-html/in.md --target-format html -o /tmp/omni_val/orf-backfill-html/out.html
    timeout_seconds: 120
    expect:
      exit_code: 0
      stdout_has: ["Created /tmp/omni_val/orf-backfill-html/out.html"]
    standard: STANDARDS.md#exit-codes
    collect_artifacts:
      - path: /tmp/omni_val/orf-backfill-html/out.html
    instructions: |-
      Run the REAL orf CLI backfill: `orf apply-md /tmp/omni_val/orf-backfill-html/in.md --target-format html -o /tmp/omni_val/orf-backfill-html/out.html`. Engine: markdown lib (pure Python). Check: exit code 0 (STANDARDS.md#exit-codes) and stdout announces the created file (both fresh conversions and cached ones print `Created <path>`). The assertion on the output file is the next step.
  - name: Assert HTML structural invariant
    kind: python
    command: |-
      import sys
      p = "/tmp/omni_val/orf-backfill-html/out.html"
      try:
          data = open(p, encoding="utf-8").read()
          assert len(data.strip()) > 0, "html output is empty"
          assert "<html" in data, "missing <html> element"
          assert "<body" in data, "missing <body> element"
          assert "Synthetic Document" in data, "markdown content missing from html body"
          print("OK: html contains <html>, <body> and the translated markdown content")
      except Exception as e:
          print("ERROR: %s" % e)
          sys.exit(1)
    expect:
      exit_code: 0
      stdout_has: ["OK:"]
    standard: STANDARDS.md#html-structure
    collect_artifacts:
      - path: /tmp/omni_val/orf-backfill-html/out.html
    instructions: |-
      Read /tmp/omni_val/orf-backfill-html/out.html and verify the HTML structural invariant: contains <html> and <body>, and the markdown heading 'Synthetic Document' survived the backfill (md2html strips the YAML frontmatter — CHANGELOG v0.4.16). The snippet exits 0 with an OK: message when the invariant holds, or exits 1 naming the problem otherwise (per-step instructions; exit-code contract).
