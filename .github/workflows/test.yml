name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 ahead of GitHub's forced upgrade on 2026-06-16.
# When removed (post-2026-09-16), this env var becomes a no-op.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/orf/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check with mypy
        run: mypy src/orf/ --ignore-missing-imports --disable-error-code=list-item --disable-error-code=arg-type --disable-error-code=assignment --disable-error-code=misc

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    needs: [lint, type-check]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install lxml weasyprint boto3 azure-storage-blob openai build fastmcp openpyxl moto

      - name: Create .venv_ol symlink (tests hardcode this path)
        run: |
          mkdir -p .venv_ol/bin
          ln -sf "$(which python)" .venv_ol/bin/python

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src/orf/ --cov-report=xml --cov-fail-under=50 --ignore=tests/test_orf_mcp_server.py --ignore=tests/test_e2e_omni_pipeline.py
